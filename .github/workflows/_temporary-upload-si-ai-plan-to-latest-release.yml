name: Temporary upload SI AI plan to latest release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-upload-si-ai-plan-to-latest-release.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged PowerPoint
        env:
          ASSET_NAME: "SI_AI_Secondary_Development_Execution_Plan_20260918_v0.2.pptx"
          EXPECTED_SHA256: "f39de0f12ed4e3a34ed054f517d46a82ea40f6c049c9c021555ef14426390d91"
          EXPECTED_SIZE: "70373"
        shell: bash
        run: |
          set -euo pipefail
          FILE=".release-staging/$ASSET_NAME"
          test -f "$FILE"
          ACTUAL_SIZE="$(wc -c < "$FILE" | tr -d ' ')"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          ACTUAL_SHA256="$(sha256sum "$FILE" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          unzip -t "$FILE"

      - name: Upload PowerPoint to latest release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: "SI_AI_Secondary_Development_Execution_Plan_20260918_v0.2.pptx"
          EXPECTED_SHA256: "f39de0f12ed4e3a34ed054f517d46a82ea40f6c049c9c021555ef14426390d91"
          EXPECTED_SIZE: "70373"
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          gh release upload "$TAG" ".release-staging/$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
          ASSET_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.assets[] | select(.name == env.ASSET_NAME) | {name, size, state, digest, browser_download_url}')"
          echo "$ASSET_JSON"
          test "$(echo "$ASSET_JSON" | jq -r '.size')" = "$EXPECTED_SIZE"
          test "$(echo "$ASSET_JSON" | jq -r '.state')" = "uploaded"
          test "$(echo "$ASSET_JSON" | jq -r '.digest')" = "sha256:$EXPECTED_SHA256"

      - name: Remove temporary upload files from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- ".release-staging/SI_AI_Secondary_Development_Execution_Plan_20260918_v0.2.pptx" ".github/workflows/_temporary-upload-si-ai-plan-to-latest-release.yml"
          git commit -m "chore: remove temporary release upload files"
          git push origin HEAD:main
