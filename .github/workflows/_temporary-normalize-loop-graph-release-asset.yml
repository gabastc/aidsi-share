name: Temporary normalize loop graph release asset

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-normalize-loop-graph-release-asset.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace normalized release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: "Loop_Graph_Engineering_Explainer_v1.1_20260918.html"
          OLD_ASSET_NAME: "LOOP-GRAPH-ENGINEERING-EXPLAINER_.__DELIVERED__v1.1__20260918.html"
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          OLD_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.assets[] | select(.name == env.OLD_ASSET_NAME) | .id' | head -n1 || true)"
          if [ -n "$OLD_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$OLD_ID"
          fi
          gh release upload "$TAG" ".release-staging/$ASSET_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.assets[] | select(.name == env.ASSET_NAME) | {name, size, state, digest, browser_download_url}'

      - name: Remove temporary upload files from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- ".release-staging/Loop_Graph_Engineering_Explainer_v1.1_20260918.html" ".github/workflows/_temporary-normalize-loop-graph-release-asset.yml"
          git commit -m "chore: remove temporary release upload files"
          git push origin HEAD:main
